<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Baba Sniper 18.0</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="icons/icon48.png" alt="Delta Baba Sniper" class="logo-img">
                <h1>Delta Baba Sniper 18.0</h1>
            </div>
            <div class="theme-toggle">
                <button id="themeToggle" class="theme-btn">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>

        <!-- Coin Info Panel -->
        <div class="coin-panel">
            <div class="coin-info">
                <span class="coin-label">Coin:</span>
                <span id="coinName" class="coin-name">Loading...</span>
            </div>
            <div class="price-info">
                <span class="price-label">Price:</span>
                <span id="currentPrice" class="current-price">₹0.00</span>
            </div>
            <div class="timeframe-selector">
                <label for="timeframe">Timeframe:</label>
                <select id="timeframe" class="timeframe-dropdown">
                    <option value="1m">1M</option>
                    <option value="5m">5M</option>
                    <option value="10m">10M</option>
                    <option value="15m">15M</option>
                    <option value="30m">30M</option>
                    <option value="1h">1H</option>
                    <option value="2h">2H</option>
                    <option value="3h">3H</option>
                </select>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="chart-container">
            <div id="chart" class="trading-chart"></div>
        </div>

        <!-- Signal Panel -->
        <div class="signal-panel">
            <div class="signal-header">
                <h3>Live Signals</h3>
                <div class="signal-status" id="signalStatus">
                    <span class="status-indicator"></span>
                    <span class="status-text">Scanning...</span>
                </div>
            </div>
            
            <div class="signal-content">
                <div class="signal-item" id="currentSignal">
                    <div class="signal-type">
                        <span class="signal-label">Signal:</span>
                        <span class="signal-value" id="signalType">--</span>
                    </div>
                    <div class="signal-confidence">
                        <span class="confidence-label">Confidence:</span>
                        <div class="confidence-bars">
                            <span class="bar active"></span>
                            <span class="bar active"></span>
                            <span class="bar active"></span>
                        </div>
                    </div>
                    <div class="signal-price">
                        <span class="price-label">Entry Price:</span>
                        <span class="price-value" id="entryPrice">--</span>
                    </div>
                    <div class="signal-time">
                        <span class="time-label">Signal Time:</span>
                        <span class="time-value" id="signalTime">--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Indicators Panel -->
        <div class="indicators-panel">
            <div class="panel-header">
                <h3>Technical Indicators</h3>
                <button id="toggleIndicators" class="toggle-btn">Hide</button>
            </div>
            <div class="indicators-content" id="indicatorsContent">
                <div class="indicator-row">
                    <span class="indicator-name">EMA 9:</span>
                    <span class="indicator-value" id="ema9">--</span>
                </div>
                <div class="indicator-row">
                    <span class="indicator-name">EMA 21:</span>
                    <span class="indicator-value" id="ema21">--</span>
                </div>
                <div class="indicator-row">
                    <span class="indicator-name">EMA 55:</span>
                    <span class="indicator-value" id="ema55">--</span>
                </div>
                <div class="indicator-row">
                    <span class="indicator-name">RSI:</span>
                    <span class="indicator-value" id="rsi">--</span>
                </div>
                <div class="indicator-row">
                    <span class="indicator-name">MACD:</span>
                    <span class="indicator-value" id="macd">--</span>
                </div>
                <div class="indicator-row">
                    <span class="indicator-name">Supertrend:</span>
                    <span class="indicator-value" id="supertrend">--</span>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <button id="startScanning" class="control-btn primary">Start Scanning</button>
            <button id="stopScanning" class="control-btn secondary" disabled>Stop Scanning</button>
            <button id="refreshData" class="control-btn">Refresh Data</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="language-switch">
                <button id="languageToggle" class="lang-btn">🇮🇳 हिंदी</button>
            </div>
            <div class="version-info">
                <span>v18.0.0 | Delta Exchange India</span>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
